version: '3'

services:
  # Note: If you are assigning a custom name to your db service on the line below, make sure it does not contain underscores
  db:
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: supertokens 
      POSTGRES_PASSWORD: supertokens 
      POSTGRES_DB: supertokens
    command: postgres -c shared_preload_libraries='pg_stat_statements' -c pg_stat_statements.track=all -c max_connections=1000 -c shared_buffers=1GB -c synchronous_commit=off -c wal_buffers=16MB -c checkpoint_timeout=30min -c max_wal_size=4GB
    ports:
      - 5432:5432
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'supertokens', '-d', 'supertokens']
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: supertokens/supertokens-postgresql
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      # The OAuth provider (Hydra, via the supertokens oauth2-test image) must be
      # up before the core so OAuth client/token calls in the suite's OAuth phase
      # can be proxied to it. It has no /hello-style healthcheck, so we only wait
      # for the container to start; the OAuth phase retries client creation.
      oauth:
        condition: service_started
    ports:
      - 3567:3567
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://supertokens:supertokens@db:5432/supertokens"
      PASSWORD_HASHING_ALG: "ARGON2"
      ARGON2_ITERATIONS: 1
      ARGON2_MEMORY_KB: 8
      ARGON2_PARALLELISM: 1
      ARGON2_HASHING_POOL_SIZE: 8
      API_KEYS: "qwertyuiopasdfghjklzxcvbnm"
      BULK_MIGRATION_PARALLELISM: "4"
      BULK_MIGRATION_BATCH_SIZE: "500"
      # Point the core at the OAuth provider so the OAuth phase (client creation,
      # M2M client-credentials tokens, introspection, revoke) works. Mirrors the
      # per-SDK compose files. OAUTH_PROVIDER_URL_CONFIGURED_IN_OAUTH_PROVIDER
      # defaults to the public service URL, so it is not set here.
      OAUTH_PROVIDER_PUBLIC_SERVICE_URL: "http://oauth:4444"
      OAUTH_PROVIDER_ADMIN_SERVICE_URL: "http://oauth:4445"
      OAUTH_PROVIDER_CONSENT_LOGIN_BASE_URL: "http://localhost:3001/auth"
      OAUTH_CLIENT_SECRET_ENCRYPTION_KEY: "asdfasdfasdfasdfasdf"
      # migration_mode for the all_auth_recipe_users deprecation. A fresh install
      # on an empty DB can start directly in any mode (no backfill needed), so the
      # stress-tests workflow runs one matrix leg per mode by exporting
      # SUPERTOKENS_MIGRATION_MODE before `docker compose up`. Defaults to LEGACY,
      # which is the core's own default and the suite's historical behavior.
      SUPERTOKENS_MIGRATION_MODE: "${SUPERTOKENS_MIGRATION_MODE:-LEGACY}"

    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  oauth:
    # SuperTokens' bundled Ory Hydra test image (public :4444 / admin :4445),
    # the same one the per-SDK compose files use. Backs the OAuth phase's client
    # creation and M2M token issuance so the OAuth-dependent stats/revoke paths
    # can be measured against real data.
    image: supertokens/oauth2-test:latest
    platform: linux/amd64
    networks:
      - app_network
    restart: unless-stopped

  pghero:
    image: ankane/pghero
    environment:
      DATABASE_URL: "postgres://supertokens:supertokens@db:5432/supertokens"
    ports:
      - 8080:8080
    networks:
      - app_network
    depends_on:
      - db
    restart: unless-stopped

networks:
  app_network:
    driver: bridge