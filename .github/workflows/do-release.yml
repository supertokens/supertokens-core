name: Release
run-name: Release v${{ inputs.core-version }}${{ inputs.is-canary && ' [canary]' || '' }}${{ inputs.fast-release && ' [smoke tests only]' || '' }}

on:
  workflow_dispatch:
    inputs:
      core-version:
        description: 'Core version (e.g. 11.4.0)'
        required: true
        type: string
      plugin-interface-version:
        description: 'Plugin interface version (e.g. 8.4.0)'
        required: true
        type: string
      postgresql-plugin-version:
        description: 'PostgreSQL plugin version (e.g. 9.4.0)'
        required: true
        type: string
      release-plugin-interface:
        description: 'Release a new plugin-interface version'
        required: true
        type: boolean
        default: true
      release-postgresql-plugin:
        description: 'Release a new postgresql-plugin version'
        required: true
        type: boolean
        default: true
      is-latest-release:
        description: 'Is this the latest release? (tags the Docker image as "latest")'
        required: true
        type: boolean
        default: true
      is-latest-for-major:
        description: 'Is this the latest release for its major version? (tags the Docker image with the major version, e.g. "9")'
        required: true
        type: boolean
        default: true
      run-stress-tests:
        description: 'Run stress tests'
        required: true
        type: boolean
        default: true
      is-canary:
        description: 'Is this a canary release? Cannot be combined with "latest release"'
        required: true
        type: boolean
        default: false
      push-to-ecr:
        description: 'Push Docker images to Amazon ECR'
        required: true
        type: boolean
        default: true
      fast-release:
        description: 'Fast release: only run smoke tests (login + session tests) instead of the full suite. Cannot be combined with "latest release"'
        required: true
        type: boolean
        default: false

jobs:
  # Fail fast on invalid input combinations before anything is registered
  # or published. Every other job depends on dependency-branches, so gating
  # it here stops the whole release.
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-22.04
    steps:
      - name: Check fast-release and is-latest-release are mutually exclusive
        if: inputs.fast-release && inputs.is-latest-release
        run: |
          echo "::error::A fast release (smoke tests only) must not be marked as the latest release. Untick one of the two options."
          exit 1
      - name: Check is-canary and is-latest-release are mutually exclusive
        if: inputs.is-canary && inputs.is-latest-release
        run: |
          echo "::error::A canary release must not be marked as the latest release. Untick one of the two options."
          exit 1

  dependency-branches:
    needs: validate-inputs
    uses: ./.github/workflows/_release-resolve-deps.yml
    with:
      core-version: ${{ inputs.core-version }}
      plugin-interface-version: ${{ inputs.plugin-interface-version }}
      postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}
    secrets: inherit

  # Derives has-db-migration from the postgresql plugin's migration manifest
  # (single source of truth) and fails the release early if the core CHANGELOG
  # doesn't document the migration. Shared with do-release-java15.yml via the
  # reusable workflow. register-versions waits on this job, so a failure stops
  # the release before anything is registered.
  derive-db-migration-flag:
    name: Derive has-db-migration from migration manifest
    needs: dependency-branches
    uses: ./.github/workflows/_release-derive-db-migration.yml
    with:
      core-version: ${{ inputs.core-version }}
      postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}
      core-sha: ${{ needs.dependency-branches.outputs.core-sha }}
      postgresql-sha: ${{ needs.dependency-branches.outputs.postgresql-sha }}
    secrets: inherit

  register-versions:
    needs: [ dependency-branches, derive-db-migration-flag ]
    uses: ./.github/workflows/_release-register-versions.yml
    with:
      core-version: ${{ inputs.core-version }}
      core-sha: ${{ needs.dependency-branches.outputs.core-sha }}
      postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}
      postgresql-sha: ${{ needs.dependency-branches.outputs.postgresql-sha }}
      release-postgresql-plugin: ${{ inputs.release-postgresql-plugin }}
      is-canary: ${{ inputs.is-canary }}
    secrets: inherit

  test:
    needs: [ dependency-branches, register-versions ]
    uses: ./.github/workflows/_release-run-tests.yml
    with:
      core-sha: ${{ needs.dependency-branches.outputs.core-sha }}
      plugin-interface-sha: ${{ needs.dependency-branches.outputs.plugin-interface-sha }}
      postgresql-sha: ${{ needs.dependency-branches.outputs.postgresql-sha }}
      fast-release: ${{ inputs.fast-release }}
    secrets: inherit

  mark-as-passed:
    needs: [ register-versions, test, derive-db-migration-flag ]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_release-mark-passed.yml
    with:
      core-version: ${{ inputs.core-version }}
      postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}
      release-postgresql-plugin: ${{ inputs.release-postgresql-plugin }}
      is-canary: ${{ inputs.is-canary }}
      has-db-migration: ${{ needs.derive-db-migration-flag.outputs.has-db-migration == 'true' }}
    secrets: inherit

  # When this release ships a DB migration, open a PR against
  # supertokens-backend-apis that adds it to the CORE_MIGRATIONS registry —
  # the change the SaaS rollout guard waits for. Plain-SQL migrations are
  # code-generated from the plugin's canonical script
  # (scripts/generate-core-migration.mjs in backend-apis - plain transactional
  # scripts and CREATE/DROP INDEX CONCURRENTLY-only patch scripts); `custom: true`
  # migrations get a PENDING doc instead, because generated code cannot
  # faithfully represent arbitrary multi-step migrations and a
  # guard-satisfying-but-wrong entry is worse than a blocking one. Everything
  # is keyed by the full core X.Y.Z (patch releases can ship index-only
  # migrations too). Skipped when the registry already has the version or the
  # PR branch already exists, so re-releases stay idempotent. continue-on-error: PR creation must never
  # fail the release — the rollout guard + pending marker + Slack reminder
  # still cover the case where this job breaks.
  open-backend-apis-migration-pr:
    name: Open backend-apis migration PR
    needs: [ dependency-branches, derive-db-migration-flag, mark-as-passed ]
    # Runs on canary releases too (by design): the core-version input and the
    # resolved postgresql-sha are identical for a canary and its real release
    # (canary only appends -canary to the *tag*), so a PR opened during canary
    # is keyed to the correct core-version and carries the correct migration
    # script. The registry-exists and branch-exists guards below then make the
    # later real release find that PR already open and idempotently skip — so
    # the migration PR simply lands earlier (at canary time) rather than being
    # duplicated. This deliberately does NOT mirror the !inputs.is-canary
    # exclusions on build-jars / the Tag core step: opening the backend-apis PR
    # early is safe and desirable, whereas publishing artifacts/tags is not.
    if: ${{ !cancelled() && !failure() && needs.derive-db-migration-flag.outputs.has-db-migration == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout supertokens-backend-apis
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-backend-apis
          ref: dev
          # Org-level secret with access to supertokens-backend-apis; GH_TOKEN
          # has no grant for that repo. Also persisted by checkout for the
          # git push below.
          token: ${{ secrets.BACKEND_APIS_PR_KEY }}
          path: backend-apis
      - name: Checkout supertokens-postgresql-plugin
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-postgresql-plugin
          ref: ${{ needs.dependency-branches.outputs.postgresql-sha }}
          token: ${{ secrets.GH_TOKEN }}
          path: plugin
      - name: Generate migration and open PR
        env:
          # gh pr create targets supertokens-backend-apis, so it needs the
          # same org-level key as the checkout above, not GH_TOKEN.
          GH_TOKEN: ${{ secrets.BACKEND_APIS_PR_KEY }}
          # Passed via env (not expanded into the shell) so the release inputs
          # can't inject GitHub-Actions expressions into this run block.
          CORE_VERSION: ${{ inputs.core-version }}
          PLUGIN_VERSION: ${{ inputs.postgresql-plugin-version }}
          # The SQL script is the migration's source of truth: consume it from
          # the derive job's output rather than re-deriving it from the manifest
          # here, so the two jobs can't disagree on which script this release
          # ships. custom/notes below are secondary metadata read once.
          SQL_FILE: ${{ needs.derive-db-migration-flag.outputs.sql-file }}
        run: |
          coreVersion="$CORE_VERSION"
          pluginVersion="$PLUGIN_VERSION"
          sqlfile="$SQL_FILE"
          entry=$(jq --arg v "$pluginVersion" '.migrations[] | select(.pluginVersion == $v)' plugin/migration-scripts/manifest.json)
          custom=$(echo "$entry" | jq -r '.custom // false')
          isPatch=$([ "$(echo "$coreVersion" | cut -d. -f3)" != "0" ] && echo true || echo false)
          notes=$(echo "$entry" | jq -r '.notes // ""')
          # has-db-migration == 'true' already gated this job, so the derive job
          # must have emitted a sql-file; treat an empty one as a contract
          # violation rather than silently generating an empty PR.
          if [ -z "$sqlfile" ]; then
            echo "::error::has-db-migration was true but the derive job produced no sql-file for plugin $pluginVersion - cannot generate the backend-apis PR."
            exit 1
          fi
          cd backend-apis
          registry=apps/backend-api/ts/helpers/multi-tenancy/rds/migration/index.ts
          if grep -q "version: \"$coreVersion\"" "$registry"; then
            echo "::notice::backend-apis CORE_MIGRATIONS already contains $coreVersion - no PR needed."
            exit 0
          fi
          branch="core-migration/v$coreVersion"
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null 2>&1; then
            echo "::notice::Branch $branch already exists on supertokens-backend-apis (PR presumably open) - skipping."
            exit 0
          fi
          git config user.name "supertokens-release-bot"
          git config user.email "team@supertokens.com"
          git checkout -b "$branch"
          suffix=${coreVersion//./_}
          if [ "$custom" = "true" ]; then
            dest=apps/backend-api/ts/helpers/multi-tenancy/rds/migration/PENDING-$coreVersion.md
            {
              echo "# PENDING: core $coreVersion DB migration (custom)"
              echo
              echo "Core $coreVersion was released with a DB migration that is marked custom in the"
              echo "postgresql plugin's migration manifest, so it cannot be code-generated:"
              echo "implement migrateTo$suffix in queries.ts by hand (multi-step /"
              echo "CONCURRENTLY handling - see the script comments), add the migrateDBTo$suffix"
              echo "wrapper and the CORE_MIGRATIONS entry in index.ts, and delete this file."
              echo "Until the entry exists, the SaaS rollout of core $coreVersion stays deferred"
              echo "(saas_rollout_pending) - that is intentional."
              if [ "$isPatch" = "true" ]; then
                echo
                echo "This is a patch-release migration (index add/drop only by rule; the core also does"
                echo "it itself at boot), so the SaaS-side implementation only has to be idempotent and"
                echo "is there for the teleport chain (CONCURRENTLY there too)."
              fi
              echo
              echo "Manifest notes: $notes"
              echo
              echo "Canonical SQL (supertokens-postgresql-plugin/migration-scripts/$sqlfile):"
              echo
              echo '```sql'
              cat "../plugin/migration-scripts/$sqlfile"
              echo '```'
            } > "$dest"
            title="core $coreVersion: implement custom DB migration (PENDING)"
          else
            node apps/backend-api/scripts/generate-core-migration.mjs "$coreVersion" "../plugin/migration-scripts/$sqlfile"
            title="core $coreVersion: add DB migration to CORE_MIGRATIONS"
          fi
          git add -A
          git commit -m "feat: add core $coreVersion DB migration (from plugin v$pluginVersion release)"
          git push origin "$branch"
          # Build the body in a file and pass --body-file: a here-block keeps the
          # continuation lines at column 0 so GitHub-flavored markdown doesn't
          # treat the indented run-block text as a code block (which would kill
          # the review checklist's checkboxes).
          bodyFile="$(mktemp)"
          {
            echo "Auto-generated by the supertokens-core release workflow for core $coreVersion (postgresql-plugin $pluginVersion)."
            echo
            echo "Source of truth: supertokens-postgresql-plugin/migration-scripts/$sqlfile (manifest entry pluginVersion $pluginVersion$([ "$isPatch" = "true" ] && echo ", patch release: index-only, CONCURRENTLY"))."
            echo "Manifest notes: $notes"
            echo
            echo "Until this is merged AND deployed, the SaaS (ECS) rollout of core $coreVersion stays deferred (core_version_metadata.saas_rollout_pending; a Slack reminder repeats every 6h). After deploying, trigger the rollout via POST /manual/multi-tenancy/core/release."
            echo
            echo "Review checklist:"
            echo "- [ ] SQL matches the plugin release's schema change (the plugin's schema-migration-check CI verified the script against a real schema diff at PR time)"
            echo "- [ ] CI green (coreMigrationsRegistry.test.ts validates registry ordering)"
            echo "- [ ] Deploy backend-apis, then trigger the SaaS rollout"
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$bodyFile"
          gh pr create --repo supertokens/supertokens-backend-apis --base dev --head "$branch" \
            --title "$title" \
            --body-file "$bodyFile"

  build-docker:
    needs: dependency-branches
    uses: ./.github/workflows/_release-build-docker.yml
    with:
      core-version: ${{ inputs.core-version }}
      is-canary: ${{ inputs.is-canary }}
      core-sha: ${{ needs.dependency-branches.outputs.core-sha }}
      plugin-interface-sha: ${{ needs.dependency-branches.outputs.plugin-interface-sha }}
      postgresql-sha: ${{ needs.dependency-branches.outputs.postgresql-sha }}
    secrets: inherit

  stress-tests:
    if: inputs.run-stress-tests
    needs: [ build-docker ]
    uses: ./.github/workflows/stress-tests.yml
    with:
      tag: ${{ needs.build-docker.outputs.dev-tag }}

  release-docker:
    needs: [ build-docker, stress-tests, mark-as-passed ]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_release-publish-docker.yml
    with:
      core-version: ${{ inputs.core-version }}
      is-canary: ${{ inputs.is-canary }}
      is-latest-release: ${{ inputs.is-latest-release }}
      is-latest-for-major: ${{ inputs.is-latest-for-major }}
      push-to-ecr: ${{ inputs.push-to-ecr }}
      dev-tag: ${{ needs.build-docker.outputs.dev-tag }}
    secrets: inherit

  add-release-tags:
    needs: [dependency-branches, release-docker, derive-db-migration-flag]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_release-add-tags.yml
    with:
      core-version: ${{ inputs.core-version }}
      plugin-interface-version: ${{ inputs.plugin-interface-version }}
      postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}
      core-sha: ${{ needs.dependency-branches.outputs.core-sha }}
      plugin-interface-sha: ${{ needs.dependency-branches.outputs.plugin-interface-sha }}
      postgresql-sha: ${{ needs.dependency-branches.outputs.postgresql-sha }}
      release-plugin-interface: ${{ inputs.release-plugin-interface }}
      release-postgresql-plugin: ${{ inputs.release-postgresql-plugin }}
      is-canary: ${{ inputs.is-canary }}
      is-latest-release: ${{ inputs.is-latest-release }}
      has-db-migration: ${{ needs.derive-db-migration-flag.outputs.has-db-migration == 'true' }}
    secrets: inherit

  build-jars:
    needs: [add-release-tags]
    if: ${{ !cancelled() && !failure() && !inputs.is-canary }}
    uses: ./.github/workflows/generate-jars.yml
    with:
      core-version: ${{ inputs.core-version }}
      plugin-interface-version: ${{ inputs.plugin-interface-version }}
      postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}
      commit-to-github: true
    secrets: inherit

  # build-jars is skipped for canary releases; !failure() lets the
  # notification still fire in that case.
  notify-slack:
    name: Notify Slack
    needs: [ add-release-tags, build-jars ]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Post release notification on Slack channel
        id: slack-notify
        # The release itself succeeded at this point — a failed notification
        # must not fail the workflow. The step below leaves a memo instead.
        continue-on-error: true
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
            text: "SuperTokens core v${{ inputs.core-version }} released${{ inputs.is-canary && ' (canary)' || '' }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🚀 SuperTokens core v${{ inputs.core-version }} released${{ inputs.is-canary && ' — canary' || '' }}${{ inputs.fast-release && ' — smoke tests only' || '' }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Core:* v${{ inputs.core-version }}\n*Plugin interface:* v${{ inputs.plugin-interface-version }}${{ !inputs.release-plugin-interface && ' (not released in this run)' || '' }}\n*PostgreSQL plugin:* v${{ inputs.postgresql-plugin-version }}${{ !inputs.release-postgresql-plugin && ' (not released in this run)' || '' }}\n*Docker `latest` tag:* ${{ inputs.is-latest-release && 'yes' || 'no' }}\n*Pushed to ECR:* ${{ inputs.push-to-ecr && 'yes' || 'no' }}\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.core-version }}${{ inputs.is-canary && '-canary' || '' }}|GitHub release> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"

      - name: Memo failed Slack notification
        if: steps.slack-notify.outcome == 'failure'
        run: |
          echo "## ⚠️ Slack notification failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The release itself completed successfully, but the announcement could not be posted to Slack." >> "$GITHUB_STEP_SUMMARY"
          echo "Check the \`SLACK_BOT_TOKEN\` and \`SLACK_RELEASE_CHANNEL_ID\` secrets, and make sure the bot is invited to the channel." >> "$GITHUB_STEP_SUMMARY"
