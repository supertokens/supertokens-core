name: Unit Tests

on:
  workflow_call:

jobs:
  dependency-branches:
    name: Dependency Branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.mirror.outputs.branches || steps.result.outputs.branches }}
      repos: ${{ steps.mirror.outputs.repos || '{"plugin-interface":"supertokens/supertokens-plugin-interface","postgresql":"supertokens/supertokens-postgresql-plugin"}' }}

    steps:
      - uses: actions/checkout@v4
      - uses: supertokens/get-core-dependencies-action@main
        id: result
        if: github.repository != 'supertokens/supertokens-core-security'
        with:
          run-for: PR
      - name: Resolve dependency branches in the -security mirrors
        id: mirror
        if: github.repository == 'supertokens/supertokens-core-security'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.EMBARGO_REPO_TOKEN }}
        run: python3 .github/helpers/resolve-mirror-dependency-branches.py

  test:
    name: Unit tests
    needs: dependency-branches
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - sqlite
          - postgresql
          # no longer supported
          # - mysql
          # - mongodb

    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21.0.7
        uses: actions/setup-java@v2
        with:
          java-version: 21.0.7
          distribution: zulu
      - uses: actions/checkout@v2
        with:
          repository: supertokens/supertokens-root
          path: ./supertokens-root
          ref: for_jdk_21_backport_releases
      - uses: actions/checkout@v2
        with:
          path: ./supertokens-root/supertokens-core
      - uses: actions/checkout@v2
        with:
          repository: ${{ fromJson(needs.dependency-branches.outputs.repos)['plugin-interface'] }}
          token: ${{ secrets.EMBARGO_REPO_TOKEN || github.token }}
          path: ./supertokens-root/supertokens-plugin-interface
          ref: ${{ fromJson(needs.dependency-branches.outputs.branches)['plugin-interface'] }}
      - uses: actions/checkout@v2
        if: matrix.plugin != 'sqlite'
        with:
          repository: ${{ fromJson(needs.dependency-branches.outputs.repos)[matrix.plugin] }}
          token: ${{ secrets.EMBARGO_REPO_TOKEN || github.token }}
          path: ./supertokens-root/supertokens-${{ matrix.plugin }}-plugin
          ref: ${{ fromJson(needs.dependency-branches.outputs.branches)[matrix.plugin] }}
      - name: Load Modules
        run: |
          cd supertokens-root
          echo "core,master
          plugin-interface,master
          ${{ matrix.plugin }}-plugin,master
          " > modules.txt
          cat modules.txt
          ./loadModules
      - name: Setup test env
        run: cd supertokens-root && ./utils/setupTestEnv --local
      - name: Start ${{ matrix.plugin }} server
        if: matrix.plugin != 'sqlite'
        run: cd supertokens-root/supertokens-${{ matrix.plugin }}-plugin && ./startDb.sh
      - name: Start otel collector
        run: |
          docker run --name otel --rm -p 4317:4317 -d otel/opentelemetry-collector-contrib:0.127.0
      - name: Run tests
        env:
          ST_PLUGIN_NAME: ${{ matrix.plugin }}
        run: |
          cd supertokens-root
          ./gradlew test
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
          include_passed: false
          annotate_notice: true
