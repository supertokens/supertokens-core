name: Retag Docker Image

on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: 'Source image tag (e.g. supertokens/supertokens-dev-postgresql:fix_my-branch)'
        required: true
        type: string
      target-tag:
        description: 'Target image tag (e.g. supertokens/supertokens-postgresql:9.3.3)'
        required: true
        type: string

jobs:
  retag:
    name: Retag Docker image
    if: github.repository == 'supertokens/supertokens-core'
    environment: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up crane
        uses: ./.github/actions/setup-crane

      - name: Retag and push
        env:
          SOURCE: ${{ inputs.source-tag }}
          TARGET: ${{ inputs.target-tag }}
        run: |
          set -euo pipefail
          if old=$(crane digest "$TARGET" 2>/dev/null); then echo "::notice::$TARGET was $old"; fi
          want=$(crane digest "$SOURCE")
          crane copy "$SOURCE" "$TARGET"
          got=$(crane digest "$TARGET")
          [ "$got" = "$want" ] || { echo "::error::$TARGET is $got, expected $want"; exit 1; }
          echo "$TARGET -> $want" >> "$GITHUB_STEP_SUMMARY"
