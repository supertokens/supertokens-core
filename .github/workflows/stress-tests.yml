name: Stress Tests

on:
  workflow_call:
    inputs:
      tag:
        description: 'Docker image tag to use'
        required: true
        type: string
      modes:
        description: 'JSON array of migration modes to run, e.g. ["MIGRATED"] or ["LEGACY"]'
        required: false
        type: string
        default: '["MIGRATED"]'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to use'
        required: true
        type: string
      modes:
        description: 'JSON array of migration modes, e.g. ["MIGRATED"]. Use ["LEGACY"] for pre-12.0 images, which have no migration feature.'
        required: false
        type: string
        default: '["MIGRATED"]'

jobs:
  stress-tests:
    runs-on: ubuntu-22.04
    # The suite runs to completion in ~75 min; the cap is generous headroom for
    # a slow runner, and exists so a hang OUTSIDE the suite's own per-step
    # budgets (npm install, docker compose up, generate-users) cannot burn the
    # 6-hour default. Raise it if the 1M dataset grows, don't remove it.
    timeout-minutes: 150
    # STILL ADVISORY: a failed stress run does not block the release — the job
    # shows a red X with its failure tables, but the workflow (and the caller's
    # release-docker gate) passes.
    #
    # This is scheduled to come off once the scaling-ratio bounds are re-based:
    # the two `Pagination full walk` steps currently sit at 13.0x against a
    # bound of 15, so enforcing today would block PRs on ~13% headroom. Until
    # then, note that nothing surfaces a failure anywhere except the run page —
    # the LEGACY leg was red for three weeks before anyone noticed.
    continue-on-error: true
    # MIGRATED only. The suite historically ran the core in its default LEGACY
    # mode; the LEGACY leg is being retired along with legacy migration mode
    # itself, and it had failed every run since 2026-08-12 on a scaling-ratio
    # assertion that is a true statement about the legacy schema (the
    # all_auth_recipe_users count path is a full scan: 855ms mean at 1M) rather
    # than a fixable bug. MIGRATED exercises the migrated-schema read paths
    # (app_id_to_user_id / recipe_user_tenants), which is what deployments
    # actually run after migration. Kept as a matrix so another mode can be
    # added back with one line; fail-fast off so a future second leg's failure
    # never cancels this one.
    #
    # The mode is an input because this job tests a PUBLISHED image, not the
    # checked-out source — so it can be dispatched from here against any release
    # line's dev image. Pre-12.0 images have no migration feature at all: there
    # is no GET /migration/mode for the suite's startup guard to confirm, and
    # asking for MIGRATED against one fails in the first minute. Dispatch those
    # with ["LEGACY"], which the guard tolerates on purpose for exactly this
    # case (an absent endpoint when LEGACY is expected is a pre-migration image
    # behaving normally).
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.modes) }}
    name: stress-tests (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v5

      - name: Derive the results artifact name
        id: artifact
        # The baseline artifact is both written and read by name, and the name
        # used to be the migration mode alone. That was fine while every run
        # came from one release line, but this job tests a PUBLISHED image, so a
        # 12.1 run and a 12.2 run would write the same artifact name and then
        # compare against each other — silently mixing release lines into one
        # trend. Qualify it with the tag so each line keeps its own baselines.
        env:
          TAG: ${{ inputs.tag }}
          MODE: ${{ matrix.mode }}
        run: |
          # Artifact names may not contain " : < > | * ? \ / — publish-dev-docker
          # already slash-sanitises branch names, but a dispatch can pass
          # anything, so normalise here too.
          safe_tag=$(printf '%s' "$TAG" | tr '"/\\:<>|*?' '_')
          echo "name=stress-test-stats-${safe_tag}-${MODE}" >> "$GITHUB_OUTPUT"
          echo "Baselines for this run: stress-test-stats-${safe_tag}-${MODE}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        # `npm install`, because there is no lockfile to install from:
        # stress-tests/.gitignore:6 ignores package-lock.json, so a fresh
        # checkout has none and both `npm ci` and setup-node's npm cache fail
        # outright ("Dependencies lock file is not found").
        #
        # This is a real gap for a benchmark — `npm install` can resolve newer
        # transitive versions between runs, so the comparison table measures
        # dependency drift alongside core changes. Fixing it properly means
        # committing a lockfile (un-ignoring it and regenerating it against the
        # current package.json, which pins supertokens-node exactly but leaves
        # the rest on carets), which is a deliberate repo-policy change rather
        # than something to slip into a CI patch.
        run: |
          cd stress-tests
          npm install
      - name: Update Docker image in compose
        run: |
          cd stress-tests
          sed -i 's|supertokens/supertokens-postgresql|supertokens/supertokens-dev-postgresql:${{ inputs.tag }}|' docker-compose.yml
          cat docker-compose.yml
      - name: Bring up the services
        # Compose interpolates SUPERTOKENS_MIGRATION_MODE into the supertokens
        # service env (see docker-compose.yml), so the core boots directly in
        # this leg's mode.
        env:
          SUPERTOKENS_MIGRATION_MODE: ${{ matrix.mode }}
        # --wait blocks until the healthchecks pass. Without it `up -d` returns
        # as soon as the containers are created and the suite can start against
        # a core that is not serving yet; `depends_on` only orders the
        # containers relative to each other, it does not gate this step.
        run: |
          cd stress-tests
          docker compose up -d --wait
      - name: Generate user jsons
        run: |
          cd stress-tests
          npm run generate-users
      - name: Run one million users test
        id: one-million-users
        shell: bash   # explicit shell => -o pipefail; without it `| tee` masks npm's exit code
        # STRESS_TEST_MIGRATION_MODE tags stats.json / the summary with the leg's
        # mode; the suite also asserts the core actually came up in this mode.
        env:
          STRESS_TEST_MIGRATION_MODE: ${{ matrix.mode }}
        run: |
          cd stress-tests
          npm run one-million-users | tee stress-tests.log
      - name: Display Test Statistics
        if: always()
        run: |
          if [ ! -f stress-tests/stats.json ]; then
            echo "stats.json not found — the run produced no measurements." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Stress Test Results — image \`${{ inputs.tag }}\`, ${{ matrix.mode }} migration mode" >> $GITHUB_STEP_SUMMARY
          echo "Duration is the 1M (large) measurement; the 100k (small) column and the ratio come from the two-size scaling run." >> $GITHUB_STEP_SUMMARY
          echo "Read-path steps run collect-and-continue: a failed step is recorded and the run keeps going, so a single run can surface every failure at once. A ⚑ marks a step that ran *after* an earlier failure — its numbers may be tainted. Ratio is \`n/a\` when a step failed on one of the two sizes." >> $GITHUB_STEP_SUMMARY
          echo "| Test | Duration (1M) | 100k | Ratio (1M/100k) | Budget | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------------|------|-----------------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          # Status must include the ratio verdict: an over-ratio step fails the
          # run, but Status used to read only the duration budget, so the row
          # rendered "✅ OK" on the exact steps that turned the job red.
          jq -r '.measurements[] | "| \(.title) | \(.formatted) | \(.smallFormatted // "-") | \(.ratioText // "-") | \(.budgetFormatted // "-") | \(if .timedOut then "⏱️ TIMED OUT" elif .failed then "❌ FAILED" elif .overBudget then "⚠️ OVER BUDGET" elif .ratioOverBound then "⚠️ OVER RATIO" else "✅ OK" end)\(if .failureReason then " — " + .failureReason else "" end)\(if .afterFailure then " ⚑" else "" end) |"' stress-tests/stats.json >> $GITHUB_STEP_SUMMARY

      - name: Display pg_stat_statements summary
        if: always()
        run: |
          if [ -f stress-tests/pg-stats-summary.md ]; then
            cat stress-tests/pg-stats-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Display comparison with previous runs
        if: always()
        # Comparison is best-effort — never fail the run over it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd stress-tests
          [ -f stats.json ] || exit 0
          mkdir -p prev-stats
          # Artifacts are listed repo-wide, newest first; the current run has not
          # uploaded its artifact yet, so these are the previous five runs. The
          # name carries both the image tag and the migration mode, so a run only
          # ever compares against prior runs of the SAME release line in the SAME
          # mode — neither the two modes nor two release lines may cross-compare.
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${{ steps.artifact.outputs.name }}&per_page=5" \
            --jq '.artifacts[] | select(.expired == false) | "\(.id)\t\(.created_at)\t\(.workflow_run.head_branch)"' \
            > artifact-list.tsv || true
          i=0
          while IFS=$'\t' read -r id created branch; do
            [ -z "$id" ] && continue
            i=$((i+1))
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "prev-${i}.zip" || continue
            mkdir -p "prev-stats/${i}"
            unzip -o -d "prev-stats/${i}" "prev-${i}.zip" > /dev/null || continue
            echo "$created" > "prev-stats/${i}/created_at"
            echo "$branch" > "prev-stats/${i}/branch"
          done < artifact-list.tsv
          [ -f prev-stats/1/stats.json ] || exit 0
          {
            echo ""
            echo "### Comparison with previous runs (${{ inputs.tag }}, ${{ matrix.mode }} mode)"
            header="| Test | This run |"
            sep="|------|----------|"
            for n in 1 2 3 4 5; do
              d="prev-stats/$n"
              if [ -f "$d/stats.json" ]; then
                label="$(cut -c1-10 "$d/created_at" 2>/dev/null || echo prev)"
                branch="$(cat "$d/branch" 2>/dev/null || true)"
                [ -n "$branch" ] && label="$label ($branch)"
                header="$header $label |"
                sep="$sep------|"
              fi
            done
            echo "$header"
            echo "$sep"
            jq -r '.measurements[] | @base64' stats.json | while read -r row; do
              title=$(echo "$row" | base64 -d | jq -r .title)
              ms=$(echo "$row" | base64 -d | jq -r .ms)
              fmt=$(echo "$row" | base64 -d | jq -r .formatted)
              line="| $title | $fmt |"
              for n in 1 2 3 4 5; do
                d="prev-stats/$n"
                [ -f "$d/stats.json" ] || continue
                prev_ms=$(jq -r --arg t "$title" '[.measurements[] | select(.title == $t) | .ms] | first // empty' "$d/stats.json")
                prev_fmt=$(jq -r --arg t "$title" '[.measurements[] | select(.title == $t) | .formatted] | first // empty' "$d/stats.json")
                if [ -n "$prev_ms" ]; then
                  delta=$(awk -v c="$ms" -v p="$prev_ms" 'BEGIN { printf "%+.1f%%", (c - p) / p * 100 }')
                  line="$line $prev_fmt ($delta) |"
                else
                  line="$line — |"
                fi
              done
              echo "$line"
            done
            echo ""
            echo "_(±% is this run relative to that run — positive means this run was slower)_"
          } >> $GITHUB_STEP_SUMMARY

      # No `if: always()` here on purpose: only successful runs become
      # comparison baselines — a failed run's timings are tainted.
      - name: Upload stats for future comparisons
        uses: actions/upload-artifact@v6
        with:
          # Tag + mode qualified: keeps each release line's baselines separate
          # (the comparison step only pulls artifacts matching this exact name)
          # and keeps concurrent matrix legs from clashing within a run.
          name: ${{ steps.artifact.outputs.name }}
          path: stress-tests/stats.json
