name: Release (Java 15)
run-name: Release (Java 15) v${{ inputs.core-version }}${{ inputs.fast-release && ' [smoke tests only]' || '' }}

on:
  workflow_dispatch:
    inputs:
      core-version:
        description: 'Core version (e.g. 10.1.7)'
        required: true
        type: string
      plugin-interface-version:
        description: 'Plugin interface version (e.g. 7.1.1)'
        required: true
        type: string
      postgresql-plugin-version:
        description: 'PostgreSQL plugin version (e.g. 8.1.5)'
        required: true
        type: string
      release-plugin-interface:
        description: 'Release a new plugin-interface version'
        required: true
        type: boolean
        default: true
      release-postgresql-plugin:
        description: 'Release a new postgresql-plugin version'
        required: true
        type: boolean
        default: true
      is-latest-release:
        description: 'Is this the latest release? (tags the Docker image as "latest")'
        required: true
        type: boolean
        default: false
      is-latest-for-major:
        description: 'Is this the latest release for its major version? (tags the Docker image with the major version, e.g. "9")'
        required: true
        type: boolean
        default: true
      run-stress-tests:
        description: 'Run stress tests'
        required: true
        type: boolean
        default: true
      push-to-ecr:
        description: 'Push Docker images to Amazon ECR'
        required: true
        type: boolean
        default: true
      fast-release:
        description: 'Fast release: only run smoke tests (login + session tests) instead of the full suite'
        required: true
        type: boolean
        default: false

env:
  total-runners: 6

jobs:
  # ── Resolve branches for the given versions ───────────────────────
  dependency-branches:
    name: Resolve dependencies
    environment: publish
    runs-on: ubuntu-22.04
    outputs:
      branches: ${{ steps.result.outputs.branches }}
    steps:
      - uses: actions/checkout@v5
      - uses: supertokens/get-core-dependencies-action@main
        id: result
        with:
          run-for: add-dev-tag
          core-version: ${{ inputs.core-version }}
          plugin-interface-version: ${{ inputs.plugin-interface-version }}
          postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}

  # ── Update dependency manifests if needed ─────────────────────────
  # Mirrors the update-deps job in release-tests.yml. This workflow is
  # dispatch-triggered, so instead of skipping and waiting for a re-trigger
  # push, it resolves the post-update SHAs that all downstream jobs consume.
  update-deps:
    name: Update dependency manifests
    environment: publish
    needs: dependency-branches
    runs-on: ubuntu-22.04
    outputs:
      core-sha: ${{ steps.shas.outputs.core }}
      plugin-interface-sha: ${{ steps.shas.outputs.plugin-interface }}
      postgresql-sha: ${{ steps.shas.outputs.postgresql }}
    steps:
      - name: Set up JDK 15
        uses: actions/setup-java@v5
        with:
          java-version: 15
          distribution: zulu

      - name: Checkout supertokens-root
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-root
          path: supertokens-root
          ref: for_jdk_15_releases

      - name: Checkout supertokens-core
        uses: actions/checkout@v5
        with:
          path: supertokens-root/supertokens-core
          ref: ${{ fromJson(needs.dependency-branches.outputs.branches)['core'] }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout supertokens-plugin-interface
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-plugin-interface
          path: supertokens-root/supertokens-plugin-interface
          ref: ${{ fromJson(needs.dependency-branches.outputs.branches)['plugin-interface'] }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout supertokens-postgresql-plugin
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-postgresql-plugin
          path: supertokens-root/supertokens-postgresql-plugin
          ref: ${{ fromJson(needs.dependency-branches.outputs.branches)['postgresql'] }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Load modules
        run: |
          cd supertokens-root
          cat > modules.txt <<'EOF'
          core,master
          plugin-interface,master
          postgresql-plugin,master
          EOF
          ./loadModules

      - name: Generate dependency manifests
        run: |
          cd supertokens-root
          ./gradlew generateDependenciesJson

      - name: Check for changes and push
        run: |
          for repo_dir in supertokens-root/supertokens-core supertokens-root/supertokens-plugin-interface supertokens-root/supertokens-postgresql-plugin; do
            if [ ! -d "$repo_dir/.git" ]; then
              continue
            fi

            pushd "$repo_dir" > /dev/null

            # Stage any changed implementationDependencies.json files
            find . -name 'implementationDependencies.json' -not -path './.git/*' -exec git add {} +

            if ! git diff --cached --quiet; then
              echo "::group::implementationDependencies.json diff in $repo_dir"
              git diff --cached
              echo "::endgroup::"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              # --no-verify: loadModules installs the developer pre-commit hook,
              # which lints (broken ec4j plugin on this root branch) and runs a
              # full build — neither applies to committing a generated manifest.
              git commit --no-verify -m "chore: update implementationDependencies.json"
              git push
              echo "Pushed updated implementationDependencies.json in $repo_dir"
            fi

            popd > /dev/null
          done

      - name: Resolve commit SHAs
        id: shas
        run: |
          echo "core=$(git -C supertokens-root/supertokens-core rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "plugin-interface=$(git -C supertokens-root/supertokens-plugin-interface rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "postgresql=$(git -C supertokens-root/supertokens-postgresql-plugin rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ── Register new versions with the SuperTokens API ────────────────
  register-core-version:
    name: Register core version
    environment: publish
    runs-on: ubuntu-22.04
    needs: update-deps
    steps:
      - name: Checkout supertokens-core
        uses: actions/checkout@v5
        # No ref: — defaults to github.sha (workflow branch), gets latest helper scripts
      - name: Fetch release data files from release branch
        run: |
          git fetch origin ${{ needs.update-deps.outputs.core-sha }}
          git checkout ${{ needs.update-deps.outputs.core-sha }} -- \
            build.gradle \
            pluginInterfaceSupported.json \
            coreDriverInterfaceSupported.json
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Register core version
        env:
          SUPERTOKENS_API_KEY: ${{ secrets.SUPERTOKENS_API_KEY }}
        run: python .github/helpers/register-new-core-version.py

  register-plugin-version:
    name: Register PostgreSQL plugin version
    if: inputs.release-postgresql-plugin
    environment: publish
    runs-on: ubuntu-22.04
    needs: update-deps
    steps:
      - name: Checkout supertokens-core
        uses: actions/checkout@v5
        # No ref: — defaults to github.sha (workflow branch), gets latest helper scripts
        # (No data files from core are needed here; postgresql plugin provides them)
      - name: Checkout supertokens-postgresql-plugin
        uses: actions/checkout@v5
        with:
          path: supertokens-plugin
          repository: supertokens/supertokens-postgresql-plugin
          ref: ${{ needs.update-deps.outputs.postgresql-sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Register plugin version
        env:
          SUPERTOKENS_API_KEY: ${{ secrets.SUPERTOKENS_API_KEY }}
          PLUGIN_NAME: postgresql
        run: |
          cd supertokens-plugin
          python ../.github/helpers/register-new-plugin-version.py

  # ── Run unit tests (sqlite + postgresql) ──────────────────────────
  runner-indexes:
    runs-on: ubuntu-22.04
    name: Generate runner indexes
    needs: dependency-branches
    outputs:
      json: ${{ steps.generate-index-list.outputs.json }}
    steps:
      - id: generate-index-list
        run: |
          MAX_INDEX=$((${{ env.total-runners }}-1))
          INDEX_LIST=$(seq 0 ${MAX_INDEX})
          INDEX_JSON=$(jq --null-input --compact-output '. |= [inputs]' <<< ${INDEX_LIST})
          echo "json=${INDEX_JSON}" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (${{ matrix.plugin }}) plugin, runner #${{ matrix.runner-index }}"
    needs: [ update-deps, register-core-version, runner-indexes ]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        runner-index: ${{ fromjson(needs.runner-indexes.outputs.json) }}
        plugin:
          - sqlite
          - postgresql

    steps:
      - name: Set up JDK 15
        uses: actions/setup-java@v5
        with:
          java-version: 15
          distribution: zulu

      - name: Checkout supertokens-root
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-root
          path: supertokens-root
          ref: for_jdk_15_releases

      - name: Checkout supertokens-core
        uses: actions/checkout@v5
        with:
          path: supertokens-root/supertokens-core
          ref: ${{ needs.update-deps.outputs.core-sha }}

      - name: Checkout supertokens-plugin-interface
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-plugin-interface
          path: supertokens-root/supertokens-plugin-interface
          ref: ${{ needs.update-deps.outputs.plugin-interface-sha }}

      - name: Checkout supertokens-postgresql-plugin
        if: matrix.plugin == 'postgresql'
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-postgresql-plugin
          path: supertokens-root/supertokens-postgresql-plugin
          ref: ${{ needs.update-deps.outputs.postgresql-sha }}

      - name: Load modules
        run: |
          cd supertokens-root
          cat > modules.txt <<'EOF'
          core,master
          plugin-interface,master
          ${{ matrix.plugin }}-plugin,master
          EOF
          ./loadModules

      - name: Start PostgreSQL
        if: matrix.plugin == 'postgresql'
        run: supertokens-root/supertokens-postgresql-plugin/startDb.sh

      - name: Start Hydra
        run: |
          docker run -d \
            --name hydra \
            --network host \
            -e DSN=memory \
            -e URLS_SELF_ISSUER=http://localhost:4444 \
            -e URLS_LOGIN=http://localhost:3001/auth/oauth/login \
            -e URLS_CONSENT=http://localhost:3001/auth/oauth/consent \
            -e URLS_LOGOUT=http://localhost:3001/auth/oauth/logout \
            -e SECRETS_SYSTEM=thisIsATestSecretThatIsAtLeast32Chars \
            -e SECRETS_COOKIE=thisIsATestCookieSecretAtLeast32 \
            -e SERVE_COOKIES_SAME_SITE_MODE=Lax \
            oryd/hydra:v2.2.0 serve all --dev
          for i in $(seq 1 30); do
            if wget -q --spider http://localhost:4444/health/alive 2>/dev/null; then
              echo "Hydra is ready"
              break
            fi
            echo "Waiting for Hydra... ($i/30)"
            sleep 2
          done

      - name: Setup test environment
        run: cd supertokens-root && ./utils/setupTestEnv --local

      - name: Check implementationDependencies.json is up to date
        run: |
          cd supertokens-root
          ./gradlew generateDependenciesJson
          git -C supertokens-core diff --exit-code \
            implementationDependencies.json \
            ee/implementationDependencies.json \
            cli/implementationDependencies.json
          if [ "${{ matrix.plugin }}" = "postgresql" ]; then
            git -C supertokens-postgresql-plugin diff --exit-code implementationDependencies.json
          fi

      - uses: chaosaffe/split-tests@v1-alpha.1
        id: split-tests
        name: Split tests
        with:
          # fast-release smoke suite: login (emailpassword) + session
          # creation/management tests only; otherwise the full suite.
          glob: ${{ inputs.fast-release && 'supertokens-root/*/src/test/java/**/{session,emailpassword}/**/*.java' || 'supertokens-root/*/src/test/java/**/*.java' }}
          # DotStartedFileTest uses fixed ports (8081-8084) on the old version
          # branches and flakes when a leaked core still holds one of them.
          # Master fixed this with dynamic ports (startIsolatedProcess), but the
          # Java 15 era branches don't have that fix, so skip the test here.
          exclude-glob: 'supertokens-root/*/src/test/java/**/DotStartedFileTest.java'
          split-total: ${{ env.total-runners }}
          split-index: ${{ matrix.runner-index }}
      - run: 'echo "This runner will execute the following tests: ${{ steps.split-tests.outputs.test-suite }}"'

      - name: Run tests
        env:
          ST_PLUGIN_NAME: ${{ matrix.plugin }}
        run: |
          cd supertokens-root
          echo "./gradlew test \\" > test.sh
          chmod +x test.sh
          IFS=' ' read -ra TESTS <<< "${{ steps.split-tests.outputs.test-suite }}"
          for test in "${TESTS[@]}"; do
            test_name="${test%.java}"
            test_name="${test_name#supertokens-root/supertokens-core/src/test/java/}"
            test_name="${test_name//\//.}"
            echo "  --tests $test_name \\" >> test.sh
          done
          echo "" >> test.sh
          echo "this is the test command:"
          cat test.sh
          echo "--------------------------------"
          ./test.sh

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
          include_passed: false
          annotate_notice: true

  # ── Mark test results on the SuperTokens API ──────────────────────
  mark-as-passed:
    name: Mark as passed (${{ matrix.plugin }})
    environment: publish
    needs: [ dependency-branches, register-plugin-version, test ]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - sqlite
          - postgresql
    steps:
      - name: Mark plugin as passed
        if: matrix.plugin != 'sqlite' && inputs.release-postgresql-plugin
        env:
          SUPERTOKENS_API_KEY: ${{ secrets.SUPERTOKENS_API_KEY }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Content-Type: application/json" \
            -H "api-version: 0" \
            -d "{\"password\":\"$SUPERTOKENS_API_KEY\",\"version\":\"${{ inputs.postgresql-plugin-version }}\",\"planType\":\"FREE\",\"name\":\"${{ matrix.plugin }}\",\"testPassed\":true}" \
            https://api.supertokens.io/0/plugin)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "API request failed with status $status"
            exit 1
          fi
      - name: Mark core as passed
        if: matrix.plugin == 'sqlite'
        env:
          SUPERTOKENS_API_KEY: ${{ secrets.SUPERTOKENS_API_KEY }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Content-Type: application/json" \
            -H "api-version: 0" \
            -d "{\"password\":\"$SUPERTOKENS_API_KEY\",\"version\":\"${{ inputs.core-version }}\",\"planType\":\"FREE\",\"testPassed\":true}" \
            https://api.supertokens.io/0/core)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "API request failed with status $status"
            exit 1
          fi

  # ── Build and publish the dev Docker image ────────────────────────
  build-docker:
    name: Build Docker image
    needs: [ update-deps ]
    runs-on: ubuntu-22.04
    outputs:
      dev-tag: ${{ steps.set_tag.outputs.TAG }}
    steps:
      - name: Set up JDK 15
        uses: actions/setup-java@v5
        with:
          java-version: 15
          distribution: zulu

      - name: Checkout supertokens-root
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-root
          path: supertokens-root
          ref: for_jdk_15_releases

      - name: Checkout supertokens-core
        uses: actions/checkout@v5
        with:
          path: supertokens-root/supertokens-core
          ref: ${{ needs.update-deps.outputs.core-sha }}

      - name: Checkout supertokens-plugin-interface
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-plugin-interface
          path: supertokens-root/supertokens-plugin-interface
          ref: ${{ needs.update-deps.outputs.plugin-interface-sha }}

      - name: Checkout supertokens-postgresql-plugin
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-postgresql-plugin
          path: supertokens-root/supertokens-postgresql-plugin
          ref: ${{ needs.update-deps.outputs.postgresql-sha }}

      - name: Load modules
        run: |
          cd supertokens-root
          cat > modules.txt <<'EOF'
          core,master
          plugin-interface,master
          postgresql-plugin,master
          EOF
          ./loadModules

      - name: Setup test environment
        run: cd supertokens-root && ./utils/setupTestEnv --local

      - name: Generate config file
        run: |
          cd supertokens-root
          cat supertokens-core/config.yaml > config.yaml
          cat supertokens-postgresql-plugin/config.yaml >> config.yaml

      - name: Compute image tag
        id: set_tag
        run: |
          echo "TAG=${{ inputs.core-version }}-dev" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push dev image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./supertokens-root
          tags: supertokens/supertokens-dev-postgresql:${{ steps.set_tag.outputs.TAG }}
          file: ./supertokens-root/supertokens-postgresql-plugin/.github/helpers/docker/Dockerfile
          platforms: linux/amd64,linux/arm64

  # ── Stress tests ──────────────────────────────────────────────────
  stress-tests:
    name: Stress tests
    if: inputs.run-stress-tests
    needs: [ build-docker ]
    uses: ./.github/workflows/stress-tests.yml
    with:
      tag: ${{ needs.build-docker.outputs.dev-tag }}

  # ── Tag and publish the release Docker image ──────────────────────
  release-docker:
    name: Release Docker image
    needs: [ build-docker, stress-tests, mark-as-passed ]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/_release-publish-docker.yml
    with:
      core-version: ${{ inputs.core-version }}
      is-canary: false
      is-latest-release: ${{ inputs.is-latest-release }}
      is-latest-for-major: ${{ inputs.is-latest-for-major }}
      push-to-ecr: ${{ inputs.push-to-ecr }}
      dev-tag: ${{ needs.build-docker.outputs.dev-tag }}
    secrets: inherit

  # ── Tag all repos with release versions ───────────────────────────
  add-release-tags:
    name: Add release tags
    environment: publish
    needs: [update-deps, release-docker]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Set up JDK 15
        uses: actions/setup-java@v5
        with:
          java-version: 15
          distribution: zulu

      - name: Checkout supertokens-root
        uses: actions/checkout@v5
        with:
          repository: supertokens/supertokens-root
          path: supertokens-root
          ref: for_jdk_15_releases

      - name: Checkout supertokens-core
        run: |
          cd supertokens-root
          git clone https://${{ secrets.GH_TOKEN }}@github.com/supertokens/supertokens-core.git
          git -C supertokens-core checkout ${{ needs.update-deps.outputs.core-sha }}

      - name: Checkout supertokens-plugin-interface
        run: |
          cd supertokens-root
          git clone https://${{ secrets.GH_TOKEN }}@github.com/supertokens/supertokens-plugin-interface.git
          git -C supertokens-plugin-interface checkout ${{ needs.update-deps.outputs.plugin-interface-sha }}

      - name: Checkout supertokens-postgresql-plugin
        run: |
          cd supertokens-root
          git clone https://${{ secrets.GH_TOKEN }}@github.com/supertokens/supertokens-postgresql-plugin.git
          git -C supertokens-postgresql-plugin checkout ${{ needs.update-deps.outputs.postgresql-sha }}

      - name: Write release password
        run: |
          cd supertokens-root
          echo "${{ secrets.SUPERTOKENS_API_KEY }}" > releasePassword
          echo "${{ secrets.SUPERTOKENS_API_KEY }}" > apiPassword

      - name: Load modules
        run: |
          cd supertokens-root
          cat > modules.txt <<'EOF'
          core,master
          plugin-interface,master
          postgresql-plugin,master
          EOF
          ./loadModules

      - name: Setup test environment
        run: cd supertokens-root && ./utils/setupTestEnv --local

      - name: Git config
        run: |
          git config --global user.name "Supertokens Bot"
          git config --global user.email "<>"

      - name: Tag plugin-interface
        id: tag-pi
        if: inputs.release-plugin-interface
        run: |
          cd supertokens-root/supertokens-plugin-interface
          ./addReleaseTag

      - name: Create plugin-interface GitHub release
        if: steps.tag-pi.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "v${{ inputs.plugin-interface-version }}" \
            --repo supertokens/supertokens-plugin-interface \
            --title "v${{ inputs.plugin-interface-version }}" \
            --generate-notes \
            ${{ inputs.is-latest-release && '--latest' || '--latest=false' }}

      - name: Tag postgresql-plugin
        id: tag-pg
        if: inputs.release-postgresql-plugin
        run: |
          cd supertokens-root/supertokens-postgresql-plugin
          ./addReleaseTag

      - name: Create postgresql-plugin GitHub release
        if: steps.tag-pg.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "v${{ inputs.postgresql-plugin-version }}" \
            --repo supertokens/supertokens-postgresql-plugin \
            --title "v${{ inputs.postgresql-plugin-version }}" \
            --generate-notes \
            ${{ inputs.is-latest-release && '--latest' || '--latest=false' }}

      - name: Tag core
        id: tag-core
        run: |
          cd supertokens-root/supertokens-core
          ./addReleaseTag

      - name: Create core GitHub release
        if: steps.tag-core.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "v${{ inputs.core-version }}" \
            --repo supertokens/supertokens-core \
            --title "v${{ inputs.core-version }}" \
            --generate-notes \
            ${{ inputs.is-latest-release && '--latest' || '--latest=false' }}

  # ── Build and commit the release JARs ─────────────────────────────
  build-jars:
    needs: [add-release-tags]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/generate-jars.yml
    with:
      core-version: ${{ inputs.core-version }}
      java-version: '15'
      plugin-interface-version: ${{ inputs.plugin-interface-version }}
      postgresql-plugin-version: ${{ inputs.postgresql-plugin-version }}
      commit-to-github: true
    secrets: inherit
