name: PR Checks
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]

jobs:
  pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        validateSingleCommit: true
  changelog:
    # The check-run name must stay "changelog" — it is the required status context in branch
    # protection (matched by name). Renaming it leaves that context permanently "Expected".
    name: changelog
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dangoslen/changelog-enforcer@8b5e9dc3121363bb7c0115f8533404d92af382de # v3.7.0
      with:
        changeLogPath: 'CHANGELOG.md'
        skipLabels: 'Skip-Changelog'
